name: Flutter CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nokhchiin

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Enforce domain and data coverage
        run: python ../tools/check_coverage.py coverage/lcov.info --include lib/domain/ --include lib/data/ --minimum 60

      - name: Audit lesson vocabulary
        run: python ../tools/audit_lesson_vocabulary.py

      - name: Audit learning content links
        run: python ../tools/audit_learning_content.py

      - name: Validate all learning content
        run: python ../tools/validate_content.py

      - name: Audit dictionary package
        run: python ../tools/audit_dictionary_package.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: nokhchiin/coverage/lcov.info
          fail_ci_if_error: false

      - name: Build web (verify compilation)
        run: flutter build web --no-tree-shake-icons

      - name: Verify SPA rewrite is packaged
        run: |
          cp web/_redirects build/web/_redirects
          test -f build/web/_redirects

      - name: Report web build size
        run: du -sh build/web

      - name: Build Android (verify compilation)
        run: flutter build apk --debug

  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nokhchiin
        run: flutter pub get

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd nokhchiin
            flutter test integration_test/app_smoke_test.dart -d emulator-5554
            flutter test integration_test/kids_learning_cycle_test.dart -d emulator-5554

