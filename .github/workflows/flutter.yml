name: Flutter CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nokhchiin

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Dart fix check
        run: dart fix --dry-run --apply lib/ || true

      - name: Test
        run: flutter test --coverage

      - name: Audit lesson vocabulary
        run: python ../tools/audit_lesson_vocabulary.py

      - name: Audit learning content links
        run: python ../tools/audit_learning_content.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: nokhchiin/coverage/lcov.info
          fail_ci_if_error: false

      - name: Build web (verify compilation)
        run: flutter build web --no-tree-shake-icons

      - name: Verify SPA rewrite is packaged
        run: |
          cp web/_redirects build/web/_redirects
          test -f build/web/_redirects

      - name: Report web build size
        run: du -sh build/web

